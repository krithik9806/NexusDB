spring.application.name=nexus-management
server.port=8080

# Embedded H2 Database for query history & audit log
spring.datasource.url=jdbc:h2:mem:nexus_management;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Actuator & Prometheus
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# JWT Secret
nexus.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
nexus.jwt.expiration-ms=86400000

# Default cluster nodes
nexus.cluster.nodes=localhost:9091,localhost:9092,localhost:9093
