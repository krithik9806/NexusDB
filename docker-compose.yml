version: '3.8'

services:
  node-1:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nexus-node-1
    command: >
      --node-id node-1
      --port 9001
      --data-dir /data
      --peers node-2=nexus-node-2:9002,node-3=nexus-node-3:9003
    ports:
      - "9001:9001"
    volumes:
      - nexus-node-1-data:/data
    networks:
      - nexus-net

  node-2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nexus-node-2
    command: >
      --node-id node-2
      --port 9002
      --data-dir /data
      --peers node-1=nexus-node-1:9001,node-3=nexus-node-3:9003
    ports:
      - "9002:9002"
    volumes:
      - nexus-node-2-data:/data
    networks:
      - nexus-net

  node-3:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nexus-node-3
    command: >
      --node-id node-3
      --port 9003
      --data-dir /data
      --peers node-1=nexus-node-1:9001,node-2=nexus-node-2:9002
    ports:
      - "9003:9003"
    volumes:
      - nexus-node-3-data:/data
    networks:
      - nexus-net

volumes:
  nexus-node-1-data:
  nexus-node-2-data:
  nexus-node-3-data:

networks:
  nexus-net:
    driver: bridge
